<!DOCTYPE html>
<html>
<head>
  <title>Fuzzy Train</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }

    #menu {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 15px;
      border-radius: 10px;
      z-index: 10;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      margin-left: -10px;
      margin-top: -10px;
      color: white;
      font-size: 24px;
      text-align: center;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div id="menu">
    <h2>Fuzzy Train</h2>
    <p>Click screen to play</p>
    <p>WASD = move</p>
    <p>Mouse = look</p>
    <p>Left click = break block</p>
    <p>Right click = place block</p>
  </div>

  <div id="crosshair">+</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    let scene, camera, renderer;
    let blocks = [];
    let keys = {};
    let yaw = 0;
    let pitch = 0;
    let velocityY = 0;
    let canJump = false;

    const blockSize = 1;
    const moveSpeed = 0.08;
    const gravity = 0.01;
    const jumpPower = 0.22;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);

      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      camera.position.set(0, 3, 8);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(10, 20, 10);
      scene.add(light);

      const ambient = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambient);

      createWorld();

      document.body.addEventListener("click", function () {
        document.body.requestPointerLock();
      });

      document.addEventListener("mousemove", function (event) {
        if (document.pointerLockElement === document.body) {
          yaw -= event.movementX * 0.002;
          pitch -= event.movementY * 0.002;
          pitch = Math.max(-1.5, Math.min(1.5, pitch));
        }
      });

      document.addEventListener("keydown", function (event) {
        keys[event.code] = true;

        if (event.code === "Space" && canJump) {
          velocityY = jumpPower;
          canJump = false;
        }
      });

      document.addEventListener("keyup", function (event) {
        keys[event.code] = false;
      });

      document.addEventListener("mousedown", function (event) {
        if (document.pointerLockElement === document.body) {
          if (event.button === 0) {
            breakBlock();
          }

          if (event.button === 2) {
            placeBlock();
          }
        }
      });

      document.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      });

      window.addEventListener("resize", function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function createWorld() {
      for (let x = -10; x <= 10; x++) {
        for (let z = -10; z <= 10; z++) {
          createBlock(x, 0, z, 0x4caf50);
        }
      }

      for (let x = -3; x <= 3; x++) {
        createBlock(x, 1, -4, 0x8b4513);
      }

      createTree(4, 1, 4);
      createTree(-5, 1, -3);
    }

    function createTree(x, y, z) {
      createBlock(x, y, z, 0x8b4513);
      createBlock(x, y + 1, z, 0x8b4513);
      createBlock(x, y + 2, z, 0x8b4513);

      createBlock(x, y + 3, z, 0x228b22);
      createBlock(x + 1, y + 3, z, 0x228b22);
      createBlock(x - 1, y + 3, z, 0x228b22);
      createBlock(x, y + 3, z + 1, 0x228b22);
      createBlock(x, y + 3, z - 1, 0x228b22);
      createBlock(x, y + 4, z, 0x228b22);
    }

    function createBlock(x, y, z, color) {
      const geometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
      const material = new THREE.MeshLambertMaterial({ color: color });

      const block = new THREE.Mesh(geometry, material);
      block.position.set(x, y, z);

      scene.add(block);
      blocks.push(block);
    }

    function animate() {
      requestAnimationFrame(animate);

      updateCamera();
      updateMovement();

      renderer.render(scene, camera);
    }

    function updateCamera() {
      camera.rotation.order = "YXZ";
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    }

    function updateMovement() {
      const direction = new THREE.Vector3();

      if (keys["KeyW"]) direction.z -= 1;
      if (keys["KeyS"]) direction.z += 1;
      if (keys["KeyA"]) direction.x -= 1;
      if (keys["KeyD"]) direction.x += 1;

      direction.normalize();

      const angle = yaw;

      const moveX =
        direction.x * Math.cos(angle) -
        direction.z * Math.sin(angle);

      const moveZ =
        direction.x * Math.sin(angle) +
        direction.z * Math.cos(angle);

      camera.position.x += moveX * moveSpeed;
      camera.position.z += moveZ * moveSpeed;

      velocityY -= gravity;
      camera.position.y += velocityY;

      if (camera.position.y <= 2) {
        camera.position.y = 2;
        velocityY = 0;
        canJump = true;
      }
    }

    function breakBlock() {
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      const hits = raycaster.intersectObjects(blocks);

      if (hits.length > 0) {
        const block = hits[0].object;

        if (block.position.y !== 0) {
          scene.remove(block);
          blocks = blocks.filter(function (b) {
            return b !== block;
          });
        }
      }
    }

    function placeBlock() {
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      const hits = raycaster.intersectObjects(blocks);

      if (hits.length > 0) {
        const hit = hits[0];

        const newPosition = hit.object.position.clone();
        newPosition.add(hit.face.normal);

        createBlock(
          Math.round(newPosition.x),
          Math.round(newPosition.y),
          Math.round(newPosition.z),
          0x8b4513
        );
      }
    }
  </script>

</body>
</html>
